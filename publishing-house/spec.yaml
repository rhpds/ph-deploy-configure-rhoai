approval_checklist:
  content:
    prerequisites_verifiable: null
    assessment_strategy: ''
    catalog_gap: "This lab uniquely covers the full RHOAI platform engineering lifecycle \u2014 from Operator installation\
      \ in both connected and air-gapped environments, through CPU-only vLLM model serving with KServe, to MaaS governance\
      \ with Kuadrant/Authorino/Limitador, and KEDA-based autoscaling with llm-d \u2014 all completable without GPU hardware.\
      \ Existing catalog items cover either MaaS consumption by developers (not platform setup), GPU-accelerated llm-d benchmarking,\
      \ or vLLM in isolation; none walk a platform engineer through the complete install-to-govern-to-scale workflow on CPU-only\
      \ infrastructure."
    design_overview: An end-to-end, CPU-only RHOAI deployment and operations lab for advanced OCP platform administrators
      and MLOps engineers, covering operator installation in connected and disconnected environments, KServe single-model
      serving with the vLLM CPU runtime, MaaS governance with Kuadrant/Authorino/Limitador and COO observability, and KEDA-based
      autoscaling for llm-d workloads. The lab supports RHOAI 3.4 and 3.5 from a single Kustomize codebase using conditional
      content gating.
    module_summaries:
    - title: 'Module 1: Install (Connected)'
      overview: Install the RHOAI Operator from OLM and create a DataScienceCluster with KServe on a connected OCP cluster.
    - title: 'Module 2: Install (Disconnected)'
      overview: Mirror RHOAI images with oc-mirror v2 and complete an offline RHOAI installation in an air-gapped cluster.
    - title: 'Module 3: Model-Serving Platform'
      overview: Create the workshop project, enable KServe single-model serving cluster-wide, and instantiate the vLLM CPU
        ServingRuntime.
    - title: 'Module 4: Serving with vLLM'
      overview: Deploy Qwen2.5-0.5B-Instruct as a KServe InferenceService and make authenticated OpenAI-compatible inference
        requests.
    - title: 'Module 5: MaaS Governance'
      overview: Stand up the full MaaS governance stack with PostgreSQL, Kuadrant, Authorino, Limitador, and COO observability;
        govern models via API keys and rate limiting.
    - title: 'Module 6: Scaling llm-d'
      overview: Install KEDA, deploy llm-d with InferencePool, and configure a ScaledObject driven by vLLM queue metrics from
        Thanos Querier to auto-scale under load.
    rcars_overlap_pct: 100
    rcars_top_matches:
