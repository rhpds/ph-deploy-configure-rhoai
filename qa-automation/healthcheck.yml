---
# HEALTHCHECK — Post-provisioning environment readiness check
# Validates that the base infrastructure is healthy before students start.
# Only checks resources deployed by provisioning automation — not lab exercises.
#
# Exit 0 = environment ready for students.

- name: Environment Health Check
  hosts: localhost
  connection: local
  gather_facts: false
  module_defaults:
    group/kubernetes.core.k8s:
      kubeconfig: "{{ k8s_kubeconfig | default(omit) }}"
  tasks:
    - name: OpenShift API is reachable
      ansible.builtin.command: oc whoami
      changed_when: false

    - name: ArgoCD bootstrap-infra Application is Synced and Healthy
      kubernetes.core.k8s_info:
        api_version: argoproj.io/v1alpha1
        kind: Application
        name: bootstrap-infra
        namespace: openshift-gitops
      register: app
      failed_when: >-
        app.resources | length == 0 or
        app.resources[0].status.sync.status != 'Synced' or
        app.resources[0].status.health.status != 'Healthy'

    - name: Quay operator CSV is Succeeded
      kubernetes.core.k8s_info:
        api_version: operators.coreos.com/v1alpha1
        kind: ClusterServiceVersion
        namespace: quay
        label_selectors:
          - operators.coreos.com/quay-operator.quay
      register: quay_csv
      failed_when: quay_csv.resources | length == 0 or quay_csv.resources[0].status.phase != 'Succeeded'

    - name: Quay registry has an endpoint
      kubernetes.core.k8s_info:
        api_version: quay.redhat.com/v1
        kind: QuayRegistry
        name: registry
        namespace: quay
      register: quay
      failed_when: >-
        quay.resources | length == 0 or
        quay.resources[0].status.registryEndpoint | default('') == ''

    - name: Keycloak pod is running
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: keycloak
        label_selectors:
          - app=keycloak
      register: kc_pods
      failed_when: >-
        kc_pods.resources | length == 0 or
        kc_pods.resources | selectattr('status.phase', 'equalto', 'Running') | list | length == 0
