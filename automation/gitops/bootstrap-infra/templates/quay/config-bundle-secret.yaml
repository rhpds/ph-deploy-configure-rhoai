{{- if .Values.quay.enabled }}
{{- $obcCm := lookup "v1" "ConfigMap" "openshift-storage" .Values.quay.storage.obcName }}
{{- $obcSecret := lookup "v1" "Secret" "openshift-storage" .Values.quay.storage.obcName }}
{{- $serviceCa := lookup "v1" "ConfigMap" "openshift-service-ca" "openshift-service-ca.crt" }}
{{- $bucketName := "" }}
{{- $accessKey := "" }}
{{- $secretKey := "" }}
{{- $caCert := "" }}
{{- if $obcCm }}
  {{- $bucketName = index $obcCm.data "BUCKET_NAME" }}
{{- end }}
{{- if $obcSecret }}
  {{- $accessKey = index $obcSecret.data "AWS_ACCESS_KEY_ID" | b64dec }}
  {{- $secretKey = index $obcSecret.data "AWS_SECRET_ACCESS_KEY" | b64dec }}
{{- end }}
{{- if $serviceCa }}
  {{- $caCert = index $serviceCa.data "service-ca.crt" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: config-bundle-secret
  namespace: {{ .Values.quay.namespace }}
type: Opaque
stringData:
  config.yaml: |
    BROWSER_API_CALLS_XHR_ONLY: false
    FEATURE_PROXY_STORAGE: true
    FEATURE_PROXY_CACHE: true
    FEATURE_REPO_MIRROR: false
    FEATURE_USER_INITIALIZE: true
    FEATURE_USER_CREATION: true
    SUPER_USERS:
    {{- range .Values.quay.superUsers }}
      - {{ . }}
    {{- end }}
    DISTRIBUTED_STORAGE_CONFIG:
        default:
            - {{ .Values.quay.storage.type }}
            - access_key: {{ $accessKey | default "PLACEHOLDER" }}
              bucket_name: {{ $bucketName | default "PLACEHOLDER" }}
              hostname: s3.openshift-storage.svc
              is_secure: true
              port: "443"
              secret_key: {{ $secretKey | default "PLACEHOLDER" }}
              storage_path: {{ .Values.quay.storage.storagePath }}
    DISTRIBUTED_STORAGE_DEFAULT_LOCATIONS: []
    DISTRIBUTED_STORAGE_PREFERENCE:
        - default
{{- if $caCert }}
  extra_ca_cert_s3.crt: |
{{ $caCert | indent 4 }}
{{- end }}
{{- end }}
